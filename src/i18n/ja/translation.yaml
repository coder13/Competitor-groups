about:
  title: このサイトについて
  welcome: CompetitionGroups.comへようこそ！
  purpose: このサイトは、WCA大会での担当割り当てを表示します。1日または複数日にわたる大会の、競技者とスタッフの割り当てを表示できます。次のラウンドの割り当ても更新します。WCAのウェブサイトに保存された内容をそのまま表示します。
  startTimes: 開始時刻と終了時刻は、生成されたWCIFデータから取得します。5分単位に丸め、会場のタイムゾーンに変換します。
  competitionAssignments: 大会の割り当てをここに表示するには、<3 to="https://groupifier.jonatanklosko.com/">Groupifier</3>、<6 to="https://delegate-dashboard.netlify.app/">DelegateDashboard</6>、<9
    to="https://goosly.github.io/AGE/">AGE</9>などのツールで割り当てを作成してください。
  developer: 表示されるデータについて詳しく知りたい開発者は、<2 to="https://github.com/thewca/wcif/blob/master/specification.md">WCIFの仕様</2>を確認してください。
  peopleCanBe: 人はグループ、ラウンド、その他の任意のアクティビティに割り当てられます。このサイトについてアイデアがあれば、<2 to="https://github.com/coder13">連絡してください</2>！
