about:
  title: Acerca de
  welcome: ¡Te damos la bienvenida a CompetitionGroups.com!
  purpose: El propósito de este sitio es mostrar las asignaciones de las competiciones de la WCA. Muestra las asignaciones
    de competidores y del personal en competiciones de uno o varios días, con una o más salas. También actualiza las asignaciones
    de las rondas siguientes. El sitio presenta las asignaciones tal como aparecen en el sitio web de la WCA.
  startTimes: Las horas de inicio y fin se toman de los datos WCIF generados, se redondean a los cinco minutos más cercanos
    y se convierten a la zona horaria del lugar.
  competitionAssignments: Para que aquí aparezcan las asignaciones de tu competición, genéralas con una herramienta como <3
    to="https://groupifier.jonatanklosko.com/">Groupifier</3>, <6 to="https://delegate-dashboard.netlify.app/">DelegateDashboard</6>
    o <9 to="https://goosly.github.io/AGE/">AGE</9>.
  developer: Si eres desarrollador y quieres saber más sobre los datos que se muestran aquí, consulta la <2 to="https://github.com/thewca/wcif/blob/master/specification.md">especificación
    WCIF</2>.
  peopleCanBe: Las personas pueden tener asignaciones en grupos, rondas o cualquier actividad. Si quieres proponer ideas para
    el sitio, puedes <2 to="https://github.com/coder13">contactarme</2>.
