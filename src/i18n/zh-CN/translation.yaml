about:
  title: 关于
  welcome: 欢迎使用 CompetitionGroups.com！
  purpose: 本网站用于显示 WCA 比赛的分组和工作安排。它可以显示举办一天或多天、设有一个或多个场地的比赛中选手和工作人员的安排，并持续更新后续轮次的安排。本网站会原样显示 WCA 网站上保存的安排。
  startTimes: 开始和结束时间直接来自生成的 WCIF 数据，四舍五入到最接近的 5 分钟，并转换为比赛场地所在时区。
  competitionAssignments: 如需在此显示比赛安排，请使用 <3 to="https://groupifier.jonatanklosko.com/">Groupifier</3>、<6 to="https://delegate-dashboard.netlify.app/">DelegateDashboard</6>
    或 <9 to="https://goosly.github.io/AGE/">AGE</9> 等工具生成安排。
  developer: 如果你是开发者，想了解此处显示的数据，请查看 <2 to="https://github.com/thewca/wcif/blob/master/specification.md">WCIF 规范</2>。
  peopleCanBe: 人员可以被分配到小组、轮次或任意活动。如果你对网站有新想法，欢迎<2 to="https://github.com/coder13">联系我</2>！
